---
Name: ai-seo
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - SilverstripeLtd\AiSeo\Extensions\AiSeoExtension

SilverStripe\Core\Injector\Injector:
  SilverstripeLtd\AiSeo\Services\AiSeoAvailabilityService:
    class: SilverstripeLtd\AiSeo\Services\AiSeoAvailabilityService

SilverstripeLtd\AiSeo\Models\GeneratedSeo:
  extensions:
    - SilverStripe\Versioned\Versioned

# Provider defaults for this module. AI_SEO_* environment variables override them, and the
# shared AI_* variables are used when no AI_SEO_* variable is set.
SilverstripeLtd\AiCore\Settings\EnvProviderSettings:
  modules:
    SEO:
      provider: gemini
      max_tokens: 2000
      request_timeout: 15
      temperature: 1.0
      providers:
        anthropic:
          model: claude-haiku-4-5
        openai:
          model: gpt-5-mini
        gemini:
          model: gemini-3.1-flash-lite
          thinking_level: low

SilverstripeLtd\AiSeo\Services\AiSeoRegenerateRateLimiter:
  max_requests: 10
  window_seconds: 300

SilverStripe\Control\Director:
  rules:
    'admin/ai-seo': SilverstripeLtd\AiSeo\Controllers\AiSeoController
    'llms.txt': SilverstripeLtd\AiSeo\Controllers\LlmsTxtController

SilverStripe\Admin\LeftAndMain:
  extra_requirements_javascript:
    'silverstripeltd/ai-seo:client/dist/js/bundle.js':
      defer: true
  extra_requirements_css:
    - 'silverstripeltd/ai-seo:client/dist/styles/bundle.css'

---
Name: ai-seo-fluent
Only:
  moduleexists: 'tractorcow/silverstripe-fluent'
---
SilverStripe\Core\Injector\Injector:
  SilverstripeLtd\AiSeo\Services\AiSeoAvailabilityService:
    class: SilverstripeLtd\AiSeo\Services\FluentAiSeoAvailabilityService

---
Name: ai-seo-elemental
Only:
  moduleexists: 'dnadesign/silverstripe-elemental'
---
SilverstripeLtd\AiSeo\Models\AiBlocksPage:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalPageExtension
